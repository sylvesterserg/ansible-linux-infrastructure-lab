name: Ansible CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Ansible and lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Prepare example inventory
        run: cp inventory/hosts.ini.example inventory/hosts.ini

      - name: Check Ansible syntax
        run: ansible-playbook playbooks/webserver.yml --syntax-check

      - name: Lint Ansible playbook
        run: ansible-lint playbooks/webserver.yml
